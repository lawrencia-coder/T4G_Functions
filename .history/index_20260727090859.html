<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Reveal Celebration</title>
    <link rel="stylesheet" href="sr">
</head>
<body>
    <header class="hero">
        <h1 class="title">🎉 Welcome to Our Gender Reveal 🎉</h1>
        <p class="subtitle">We’re thrilled to share this special moment with you!</p>
    </header>

    <section class="countdown-section">
        <h2>Countdown to the Big Reveal ⏰</h2>
        <div id="countdown"></div>
    </section>

    <section class="reveal-section">
        <img src="/images/OIP (2).webp" alt="Gender Reveal Celebration" class="main-image">
        <p class="intro-text">Take a guess — will it be a boy or a girl? 💖💙</p>

        <div class="buttons">
            <button id="boyBtn" class="reveal-btn boy">It's a Boy 💙</button>
            <button id="girlBtn" class="reveal-btn girl">It's a Girl 💖</button>
        </div>

        <div id="confettiContainer"></div>
    </section>

    <section class="gallery">
        <h2>Our Journey So Far 💕</h2>
        <div class="photo-grid">
            <img src="/images/pregnancy1.webp" alt="Pregnancy moment">
            <img src="/images/pregnancy2.webp" alt="Ultrasound photo">
            <img src="/images/pregnancy3.webp" alt="Baby bump">
        </div>
    </section>

    <footer class="footer">
        <p>Made with love by the proud parents-to-be 💕</p>
    </footer>

    <script src="src/function.js"></script>
</body>
</html>
