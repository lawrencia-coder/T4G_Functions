<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gender Reveal Celebration</title>
    <link rel="stylesheet" href="src/style.css">
</head>
<body>

        <h1 class="title">🎉 Welcome to Our Gender Reveal 🎉</h1>
        <p class="subtitle">We’re thrilled to share this special moment with you!</p>

    <section class="reveal-section">
        <img src="/images/OIP (2).webp" alt="Gender Reveal Celebration" class="main-image">
        <p class="intro-text">Take a guess — will it be a boy or a girl? 💖💙</p>

        <div class="buttons">
            <button id="boyBtn" class="reveal-btn boy">It's a Boy 💙</button>

        </div>

        <div id="celebration"></div>
    </section>

    <footer class="footer">
        <p>Made with love by the proud parents-to-be 💕</p>
    </footer>

    <script src="src/"></script>

</html>
